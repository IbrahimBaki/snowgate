  "rulings": [
    {
      "decision": "Fix an M2 (PF-0003) lock defect found while testing SSO: route.continue() let the browser follow 3xx redirects without re-checking them, so an allowed URL could redirect to another host or a locked page. The route handler now fetches with maxRedirects 0 and checks each Location before handing the redirect back",
      "reason": "The SSO expiry test showed the IdP being reached through a redirect; a probe confirmed redirects bypass the handler; a mutation test proves the new redirect tests fail with route.continue()",
      "costIfWrong": "All browser traffic is proxied through route.fetch; very large or streaming responses may be slower",
      "createdAt": "2026-10-19T14:50:06.208Z"
    },
    {
      "decision": "REST stays Basic auth with SN_USER/SN_PASSWORD (an integration account with local credentials) while the browser uses the SSO profile; ui_auth: password remains an opt-in for non-SSO instances",
      "reason": "SSO users usually cannot use Basic auth on the Table API; the user has not yet said how REST should authenticate on their instances",
      "costIfWrong": "REST tools and discover fail on instances without a local-credential integration account; OAuth is the planned follow-up (PLAN §13)",
