  "acceptanceCriteria": [
    {
      "id": "AC-001",
      "requirement": "REQ-001",
      "statement": "ui_use_update_set creates (or reuses) an in-progress update set named '<work-id> - <title>' (title from the YallaFlow work item unless given), makes it the current set through the instance's own UI actions, verifies it via sys_user_preference, and never selects Default or a set of another work item; ordinary form saves are not blocked by request-body inspection, which is kept for update-set processors.",
      "provenance": [
        {
          "type": "request"
        }
      ],
      "status": "active",
      "recordedAt": "2026-10-19T22:21:57.456Z",
