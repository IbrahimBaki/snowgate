      "id": "K-002",
      "kind": "business-rule",
      "source": "implementation-runtime",
      "summary": "Gateway UI input: ui_type sets a field by its kind (dropdown → option by visible text or value, checkbox/radio → true/false through the label only when it differs, text → typed); ui_click on a checkbox clicks its label; a field on a closed form tab is revealed by opening its tab first; ui_select picks an option in native, select2 or autocomplete dropdowns and verifies the value; locators wait up to 5s, prefer the single select/input among label matches, accept nth and pin by id; unknown arguments are dropped and reported as ignored_arguments, ui_type text is taken as value; after a click or submit, a form submitted (navigation POST) whose page no frame shows any more — ServiceNow saved it and returned to its previous page — is reported as a notice naming that page (a blocked return to an update-set page resets the browser and is also a notice); Playwright failures surface as UI_ACTION_FAILED with action/kind details and are recorded as feedback (clearable with snowgate feedback clear).",
