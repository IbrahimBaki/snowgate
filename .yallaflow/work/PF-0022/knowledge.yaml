      "summary": "snowgate hook pre-tool-use (Claude and Codex) exits 2 to block: raw Playwright MCP tools; non-snowgate MCP tools whose arguments mention service-now.com; shell commands invoking the human-only commands; writes to .snowgate/**, .claude/skills/snowgate, .claude/settings*.json and .codex/; any access to the SSO profiles or the protected credential store; git commit when validate or the secret scan fails. Shell commands are judged one command at a time (shellSegments: split at ; & | && || and newlines outside quotes; a quoted script or heredoc body stays with the command that runs it; 2>&1 and &> are not separators); a command that mentions a protected path is allowed only when read-only (cat/find/sed -n/awk/jq/tree/yallaflow/snowgate... without -i, -delete, -exec, system() or redirection to a file; redirects to the other stream or /dev/null do not count).",
