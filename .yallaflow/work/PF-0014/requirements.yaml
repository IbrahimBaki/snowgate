      "id": "REQ-002",
      "statement": "A user sends the collected feedback to the snowgate developer with one command and a confirmation; it reaches a public GitHub repository, with a fallback when GitHub is not reachable.",
      "provenance": [
        {
          "type": "request"
        }
      ],
      "status": "active",
      "recordedAt": "2026-10-19T21:31:24.430Z",
