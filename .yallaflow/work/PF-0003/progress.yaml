      "decision": "Validator Fix3 parity cases map the origin tasks/ front-matter approval to snowgate plan approval records: 'pending' -> only a non-plan approval exists, 'no approval block' -> no record, 'scope mismatch' -> plan approval for another change_id; error texts differ from the origin",
      "reason": "YallaFlow is the source of truth for work (PLAN §3.2) and A5 replaces agent-editable approval text with user-held records",
      "costIfWrong": "A real origin rule could be weakened; mitigated because each origin case keeps its pass/fail outcome",
      "createdAt": "2026-10-19T14:32:30.247Z"
    },
    {
      "decision": "committed/verified packages require a current commit approval record (hash-bound) instead of the 'Approved by' line in verification.md",
      "reason": "verification.md is agent-editable (PLAN §15 A5)",
      "costIfWrong": "Packages committed with only verification.md text now fail validate; they need an approval record",
      "createdAt": "2026-10-19T14:32:30.360Z"
