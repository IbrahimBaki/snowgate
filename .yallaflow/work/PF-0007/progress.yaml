      "completedAt": "2026-10-19T17:00:13.100Z",
      "summary": "Root cause reproduced locally: a persistent Chromium context drops cookies without Expires/Max-Age when it closes (JSESSIONID survived only within the same context; a Max-Age cookie survived the reopen). ServiceNow session cookies are session cookies, so the login session never reaches the gateway. Fix: before closing, snowgate login re-saves the instance host's session cookies with an explicit expiry (default 12h, SNOWGATE_SESSION_HOURS) so the profile keeps them; the instance's own server-side session timeout still applies and SESSION_EXPIRED remains the signal to log in again.",
      "evidence": [
        "src/login.js"
      ]
    },
