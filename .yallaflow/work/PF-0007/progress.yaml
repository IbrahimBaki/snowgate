      "status": "completed",
      "startedAt": "2026-10-19T17:00:49.492Z",
      "completedAt": "2026-10-19T17:00:49.492Z",
      "summary": "src/login.js keepSessionCookies: before closing, re-saves the instance origin's session cookies (expires -1) with an explicit expiry (SNOWGATE_SESSION_HOURS, default 12h, max 168); IdP cookies untouched. CLI reports how many were kept. test/sso-profile.test.js fixture now uses a session cookie like JSESSIONID; mutation check: without the fix the reuse test fails.",
      "evidence": [
        "src/login.js"
      ]
