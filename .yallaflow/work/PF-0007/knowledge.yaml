      "kind": "environment",
      "source": "implementation-runtime",
      "summary": "REST credentials come only from environment variables named in pack.yaml (SN_USER / SN_PASSWORD, Basic auth, an integration account with local credentials). The gateway's browser authenticates with a dedicated per-instance snowgate profile signed in by a human (snowgate login), stored owner-only under $XDG_STATE_HOME/snowgate/profiles/<instance> outside the repo; because ServiceNow session cookies have no expiry, snowgate login re-saves the instance's session cookies with an explicit lifetime (SNOWGATE_SESSION_HOURS, default 12h) so the gateway can reuse them; ui_auth: password opts into the login.do form. Credentials and cookies are never written to output, evidence or audit.",
