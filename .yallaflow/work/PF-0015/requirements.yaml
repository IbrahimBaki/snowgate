    {
      "id": "REQ-001",
      "statement": "By default the agent can read any table and field on the target except sensitive data, so tasks are not blocked by a fixed allowlist.",
      "provenance": [
        {
          "type": "request"
        }
      ],
      "status": "active",
      "recordedAt": "2026-10-19T22:01:02.667Z",
      "updatedAt": "2026-10-19T22:01:02.667Z"
    },
    {
      "id": "REQ-002",
      "statement": "A project can restrict data access with a configuration option that is documented and announced to the agent but not asked during setup.",
      "provenance": [
        {
          "type": "request"
        }
      ],
      "status": "active",
      "recordedAt": "2026-10-19T22:01:02.667Z",
      "updatedAt": "2026-10-19T22:01:02.667Z"
    },
    {
      "id": "REQ-003",
      "statement": "Each refused field is its own feedback gap.",
      "provenance": [
        {
          "type": "request"
        }
      ],
      "status": "active",
      "recordedAt": "2026-10-19T22:01:02.667Z",
